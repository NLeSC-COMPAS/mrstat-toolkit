name: python-ci

on:
  push:
    branches: [main]
    # The tests run only when a file that can change their result changes
    paths: &code
      - "python/neuralbloch/src/**"
      - "python/neuralbloch/tests/**"
      - "python/neuralbloch/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths: *code
  # Manual run from the Actions tab or `gh workflow run`
  workflow_dispatch:

# A new push to a pull request cancels the run of the push before it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15 has no onnxruntime wheel yet
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python/neuralbloch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked

      - name: unit tests
        run: uv run pytest tests/unit -ra --cov --cov-report=

      - name: integration tests
        run: uv run pytest tests/integration -ra --cov --cov-append --cov-report=

      - name: coverage
        run: |
          total=$(uv run coverage report --format=total)
          echo "coverage: ${total}%"
          uv run coverage xml

      # One upload is enough: the matrix runs the same tests on each version
      - name: upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: python/neuralbloch/coverage.xml
          flags: python
          fail_ci_if_error: false
