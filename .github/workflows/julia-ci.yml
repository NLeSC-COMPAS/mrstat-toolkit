# Runs tier T0 only (Julia-only tests). Hosted runners have neither a GPU nor
# TensorRT, so the test suite skips T1–T3 by itself and prints why; nothing
# here selects tiers. T0–T3 run on a GPU machine with TensorRT installed.
name: julia-ci

on:
  push:
    branches: [main]
    paths: &julia
      - "julia/**"
      - "Project.toml"
      - ".github/workflows/julia-ci.yml"
  pull_request:
    paths: *julia

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: julia/NeuralBloch.jl
      - uses: julia-actions/julia-runtest@v1
        with:
          project: julia/NeuralBloch.jl
